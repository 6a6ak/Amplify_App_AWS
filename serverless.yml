service: amplify-esp32-api

provider:
  name: aws
  runtime: nodejs22.x
  region: eu-central-1
  environment:
    DDB_TABLE: ESP_Data
    STATUS_TOPIC_FILTER: "+/status"
    ONLINE_THRESHOLD_MS: "60000"
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID}
    COGNITO_CLIENT_ID: ${env:COGNITO_CLIENT_ID}
    COGNITO_ADMIN_GROUP: ${env:COGNITO_ADMIN_GROUP, 'admin'}

functions:
  api:
    handler: server/lambda.handler
    events:
      - httpApi:
          path: /api/{proxy+}
          method: ANY

package:
  patterns:
    - 'server/**'
    - '!server/.env*'
    - '!server/aws_tmp/**'
    - '!server/aws_lambda/**'
    - '!server/**/*.test.js'
    - '!**/.git/**'