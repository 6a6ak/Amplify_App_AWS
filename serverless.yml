service: amplify-esp32-api

provider:
  name: aws
  runtime: nodejs18.x
  region: eu-central-1
  environment:
    DDB_TABLE: ESP_Data
    STATUS_TOPIC_FILTER: "+/status"
    ONLINE_THRESHOLD_MS: "60000"

functions:
  api:
    handler: server/lambda.handler
    events:
      - httpApi:
          path: /api/{proxy+}
          method: ANY

package:
  patterns:
    - 'server/**'
    - '!server/node_modules/aws-sdk/**'
    - '!**/.git/**'